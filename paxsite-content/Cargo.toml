[package]
name = "paxsite-content"
version = "0.1.0"
edition = "2024"

[features]
# When enabled, draft documents are loaded from disk (and emitted by paxsite).
# Without this feature, drafts are silently skipped at read time.
draft = []

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
toml-datetime-compat = { workspace = true }
paxhtml = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
