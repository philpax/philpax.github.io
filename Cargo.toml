[package]
name = "paxsite"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "bake_assets", "music-export", "paxsite-content", "paxsite-cli", "paxsite-music"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
arborium = { version = "2.4", default-features = false, features = [
    "lang-bash",
    "lang-c",
    "lang-css",
    "lang-d",
    "lang-html",
    "lang-lua",
    "lang-nix",
    "lang-python",
    "lang-ruby",
    "lang-rust",
    "lang-toml",
    "lang-powershell"
] }
image = { version = "0.25.1", features = [
    "png",
    "ico",
    "jpeg",
], default-features = false }
resvg = "0.44"
usvg = "0.44"
fontdb = "0.22"
ttf-parser = "0.24"
rayon = "1.10"
base64 = "0.22.1"
# Shared HTTP client. `blocking` is for paxsite-content's sync build-time Bluesky fetches;
# `rustls-tls` matches the TLS backend jacquard pulls in, so reqwest's features unify to a
# single rustls stack across the workspace rather than dragging in native-tls too.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
chrono = { version = "0.4.37", default-features = false, features = [
    "std",
    "now",
] }
toml = "0.8.12"
toml-datetime-compat = { version = "0.3.0", features = ["chrono"] }
sha2 = "0.10"
markdown = "1.0.0"
paxhtml = { git = "https://github.com/philpax/paxhtml.git" }
# paxhtml = { path = "../paxhtml/paxhtml" }
blackbird-shared = { git = "https://github.com/philpax/blackbird.git" }
blackbird-state = { git = "https://github.com/philpax/blackbird.git" }
# blackbird-shared = { path = "../blackbird/blackbird-shared" }
# blackbird-state = { path = "../blackbird/blackbird-state" }

[dependencies]
paxhtml = { workspace = true }
paxsite-music = { path = "paxsite-music" }

# serve
sha1 = { version = "0.10.6", optional = true }

anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
markdown = { workspace = true }
rss = { version = "2.0.7", features = ["atom"] }
serde = { workspace = true }
serde_json = { workspace = true }
arborium = { workspace = true }
toml = { workspace = true }
paxsite-content = { path = "paxsite-content" }
toml-datetime-compat = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
usvg = { workspace = true }
fontdb = { workspace = true }
ttf-parser = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
# Fonts: HarfBuzz subsetter/instancer (the `sys` module exposes the axis calls
# the safe API lacks), WOFF2 encoder, HTML parser.
mkwebfont_hb-subset = "0.5"
scraper = "0.27"
ttf2woff2 = { version = "0.13", default-features = false }

[features]
serve = ["dep:sha1"]
dump_tree = ["paxhtml/dump_tree"]
draft = []

[profile.dev.package]
image.opt-level = 3
crc32fast.opt-level = 3
miniz_oxide.opt-level = 3
png.opt-level = 3
markdown.opt-level = 3
unicode-id.opt-level = 3
arborium.opt-level = 3
arborium-bash.opt-level = 3
arborium-c.opt-level = 3
arborium-css.opt-level = 3
arborium-d.opt-level = 3
arborium-highlight.opt-level = 3
arborium-html.opt-level = 3
arborium-javascript.opt-level = 3
arborium-lua.opt-level = 3
arborium-nix.opt-level = 3
arborium-python.opt-level = 3
arborium-ruby.opt-level = 3
arborium-theme.opt-level = 3
arborium-toml.opt-level = 3
arborium-tree-sitter.opt-level = 3
# Font subsetting (see src/fonts/).
mkwebfont_hb-subset.opt-level = 3
ttf2woff2.opt-level = 3
brotli.opt-level = 3
sha2.opt-level = 3
html5ever.opt-level = 3
markup5ever.opt-level = 3
tendril.opt-level = 3
string_cache.opt-level = 3
scraper.opt-level = 3
selectors.opt-level = 3
ego-tree.opt-level = 3
