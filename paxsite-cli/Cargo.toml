[package]
name = "paxsite-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
paxsite-content = { path = "../paxsite-content" }
inquire = "0.7"
jacquard = { version = "0.12.0", features = ["loopback"] }
# jacquard's OAuth client is now generic over an `HttpClient`; we pass a `reqwest::Client`
# (the same backend jacquard uses, so reqwest's features unify across the build).
reqwest = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
